name: futbolia
description: MatchArena — football à 5, futsal et tournois amateurs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^11.0.0
  provider: ^6.1.5+1
  socket_io_client: ^2.0.3+1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#070B09"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg_stadium_night.jpg
    - assets/images/bg_pitch.jpg
    - assets/images/logo_matcharena.png
    - assets/images/app_icon.png
