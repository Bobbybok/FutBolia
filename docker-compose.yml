services:
  postgres:
    image: postgres:16-alpine
    container_name: futbolia-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: futbolia
      POSTGRES_PASSWORD: futbolia_dev_change_me
      POSTGRES_DB: futbolia_dev
    ports:
      - "5432:5432"
    volumes:
      - futbolia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futbolia -d futbolia_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  futbolia_pg_data:
